<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Cat Escape Hide and Seek</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Khung khoa ti le 1080:1920, co gian vua khung hinh, canh giua */
      #unity-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-frame {
        position: relative;
        aspect-ratio: 1080 / 1920;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }

      /* Khi khung hinh cao hon 9:16 thi chieu cao la canh gioi han */
      @media (min-aspect-ratio: 1080/1920) {
        #unity-frame {
          width: auto;
          height: 100%;
        }
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        display: none;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 6px;
        background: #2a2a2a;
        border-radius: 3px;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
        transition: width 0.15s linear;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        max-width: 90%;
        display: none;
        font-family: sans-serif;
        font-size: 13px;
      }

      #unity-warning > div {
        margin: 4px 0;
        padding: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-frame">
        <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"></div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') {
          div.style = 'background: red; padding: 10px;';
        } else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/HiAndSeek.loader.js";
      var config = {
        dataUrl: buildUrl + "/HiAndSeek.data",
        frameworkUrl: buildUrl + "/HiAndSeek.framework.js",
        codeUrl: buildUrl + "/HiAndSeek.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "CAT Studio",
        productName: "Cat Escape Hide and Seek",
        productVersion: "0.1.20",
        showBanner: unityShowBanner,
        // Cho canvas backbuffer bam theo kich thuoc CSS (net tren man hinh HiDPI)
        matchWebGLToCanvasSize: true,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function(unityInstance) {
          loadingBar.style.display = "none";
          window.unityInstance = unityInstance;
        }).catch(function(message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
